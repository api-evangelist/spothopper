    product — its own FAQ says guests are linked out to OpenTable, Yelp and
    UberEats with "no integrations needed" — and there is no developer page,
    API reference or spec on any host it controls: www.spothopperapp.com and
    api.spotapps.co (which, despite the "api." label, resolves to the same
    34.194.50.185 marketing application) answer every spec path with the
    171,924-byte single-page-application homepage, while /api returns a hard 404.
